<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 GPS 定位</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      border: none;
      background: #2e7d32;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      line-height: 2;
    }
  </style>
</head>

<body>

  <h1>🌲 森林巡查 GPS</h1>

  <button onclick="getLocation()">
    📍 取得我的位置
  </button>

  <div id="result">
    尚未定位
  </div>

  
<script>
  let latitude;
  let longitude;

  function getLocation() {

    const result = document.getElementById("result");

    if (!navigator.geolocation) {
      result.innerHTML = "❌ 手機不支援 GPS 定位";
      return;
    }

    result.innerHTML = "📡 正在取得 GPS 位置...";

    navigator.geolocation.getCurrentPosition(

      function(position) {

        latitude = position.coords.latitude;
        longitude = position.coords.longitude;

        const accuracy = position.coords.accuracy;

        result.innerHTML =
          "📍 緯度：" + latitude.toFixed(6) + "<br>" +
          "📍 經度：" + longitude.toFixed(6) + "<br>" +
          "🎯 定位精度：約 " + Math.round(accuracy) + " 公尺<br><br>" +

          '<button onclick="openMap()">🗺️ 開啟地圖</button>';
      },

      function(error) {

        result.innerHTML =
          "❌ 定位失敗<br>" +
          "請確認手機的位置功能已開啟";
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );
  }


  function openMap() {

    if (latitude && longitude) {

      const url =
        "https://www.google.com/maps/search/?api=1&query="
        + latitude + "," + longitude;

      window.open(url, "_blank");
    }
  }
</script>
</body>
</html>
