<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 GPS 定位</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      border: none;
      background: #2e7d32;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      line-height: 2;
    }
  </style>
</head>
<body>

  <h1>🌲 森林巡查紀錄</h1>

  <label>林班號</label><br>
  <input id="linban" type="text" placeholder="例如：竹東81林班">

  <br><br>

  <label>巡查結果</label><br>
  <select id="resultType">
    <option>正常</option>
    <option>發現異常</option>
    <option>發現崩塌</option>
    <option>發現違規</option>
    <option>需要後續處理</option>
  </select>

  <br><br>

  <label>備註</label><br>
  <textarea id="note" placeholder="輸入巡查情況"></textarea>

  <br><br>

<label>現場照片</label><br>

<input
  id="photo"
  type="file"
  accept="image/*"
  multiple
>

<div id="photoPreview"></div>
<br>

  <button onclick="getLocation()">
    📍 取得 GPS
  </button>

  <div id="gps">
    尚未定位
  </div>

  <br>

  <button onclick="saveRecord()">
    💾 儲存巡查紀錄
  </button>

  <div id="record"></div>


<script>

let latitude = "";
let longitude = "";


// ==========================
// 📍 GPS 定位
// ==========================

function getLocation() {

  const gps = document.getElementById("gps");

  gps.innerHTML = "📡 正在定位...";

  if (!navigator.geolocation) {

    gps.innerHTML = "❌ 此手機不支援 GPS 定位";
    return;

  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      gps.innerHTML =
        "📍 緯度：" + latitude.toFixed(6) + "<br>" +
        "📍 經度：" + longitude.toFixed(6) +
        "<br><br>" +
        "<button onclick='openMap()'>🗺️ 查看地圖</button>";

    },

    function(error) {

      gps.innerHTML = "❌ GPS 定位失敗";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}


// ==========================
// 📷 照片預覽
// ==========================
document.getElementById("photo").addEventListener("change", function(event) {

  const files = event.target.files;

  const preview =
    document.getElementById("photoPreview");

  preview.innerHTML = "";

  for (let i = 0; i < files.length; i++) {

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(files[i]);

    img.style.width = "120px";
    img.style.height = "120px";
    img.style.objectFit = "cover";
    img.style.margin = "5px";
    img.style.borderRadius = "8px";

    preview.appendChild(img);
  }

});


// ==========================
// 💾 儲存巡查紀錄
// ==========================

function saveRecord() {

  const linban =
    document.getElementById("linban").value;

  const resultType =
    document.getElementById("resultType").value;

  const note =
    document.getElementById("note").value;

  const photo =
    document.getElementById("photo");

  const time =
    new Date().toLocaleString("zh-TW");


  // 沒有照片
  if (photo.files.length === 0) {

    const record = {

      time: time,
      linban: linban,
      result: resultType,
      note: note,
      latitude: latitude,
      longitude: longitude,
      photos: []

    };

    saveToStorage(record);

    return;
  }


  // 有多張照片
  const files = Array.from(photo.files);

  const photoPromises = files.map(function(file) {

    return new Promise(function(resolve) {

      compressImage(file, function(imageData) {

        resolve(imageData);

      });

    });

  });


  // 等所有照片都壓縮完成
  Promise.all(photoPromises)
    .then(function(images) {

      const record = {

        time: time,
        linban: linban,
        result: resultType,
        note: note,
        latitude: latitude,
        longitude: longitude,

        // 📷 多張照片
        photos: images

      };

      saveToStorage(record);

    });

}
// ==========================
// 🗜️ 壓縮照片
// ==========================

function compressImage(file, callback) {

  const reader = new FileReader();

  reader.onload = function(event) {

    const img = new Image();

    img.onload = function() {

      const canvas = document.createElement("canvas");

      const maxWidth = 1200;

      let width = img.width;
      let height = img.height;


      if (width > maxWidth) {

        height =
          height * maxWidth / width;

        width = maxWidth;

      }


      canvas.width = width;
      canvas.height = height;


      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      const compressedImage =
        canvas.toDataURL(
          "image/jpeg",
          0.7
        );


      callback(compressedImage);

    };


    img.src = event.target.result;

  };


  reader.readAsDataURL(file);

}


// ==========================
// 💾 寫入手機
// ==========================

function saveToStorage(record) {

  try {

    let records =
      JSON.parse(
        localStorage.getItem("forestRecords")
      ) || [];


    records.push(record);


    localStorage.setItem(
      "forestRecords",
      JSON.stringify(records)
    );


    alert("✅ 巡查紀錄已儲存！");


    showRecords();

  }

  catch (error) {

    alert(
      "❌ 儲存失敗！\n\n" +
      "可能是手機儲存空間已滿，" +
      "或照片檔案太大。"
    );

    console.error(error);

  }

}


// ==========================
// 📋 顯示巡查紀錄
// ==========================

function showRecords() {

  const recordBox =
    document.getElementById("record");


  let records =
    JSON.parse(
      localStorage.getItem("forestRecords")
    ) || [];


  if (records.length === 0) {

    recordBox.innerHTML =
      "<h2>📋 巡查紀錄</h2>" +
      "<p>目前還沒有紀錄</p>";

    return;

  }


  recordBox.innerHTML =
    "<h2>📋 巡查紀錄</h2>";


  records.forEach(function(item, index) {

    recordBox.innerHTML +=

      "<div style='" +
      "border:1px solid #ccc;" +
      "padding:15px;" +
      "margin:15px 0;" +
      "border-radius:10px;'>" +

      "<b>第 " +
      (index + 1) +
      " 筆</b><br><br>" +

      "🕐 時間：" +
      item.time +
      "<br>" +

      "🌲 林班：" +
      item.linban +
      "<br>" +

      "📍 緯度：" +
      item.latitude +
      "<br>" +

      "📍 經度：" +
      item.longitude +
      "<br>" +

      "📌 結果：" +
      item.result +
      "<br>" +

      "📝 備註：" +
      item.note +

      (item.photos && item.photos.length > 0

        ? "<br><br>" +

          item.photos.map(function(photo) {

              return "<img src='" +
                photo +
                "' style='" +
                "width:120px;" +
                "height:120px;" +
                "object-fit:cover;" +
                "margin:5px;" +
                "border-radius:10px;'>";

    }).join("")

  : "")+
  "<br><br>" +
  
  "<button onclick='openRecordMap(" + index + ")'>" +
  "🗺️ 查看位置" +
  "</button>" +
  
  "<button onclick='deleteRecord(" + index + ")' " +
  "style='background:#c62828;margin-left:10px;'>" +
  "🗑️ 刪除" +
  "</button>" +

      "</div>";

  });

}


// ==========================
// 🗺️ 開啟 Google Maps
// ==========================

function openMap() {

  if (!latitude || !longitude) {

    alert("❌ 請先取得 GPS 位置");

    return;

  }


  const mapURL =
    "https://www.google.com/maps/search/?api=1&query=" +
    latitude +
    "," +
    longitude;


  window.open(
    mapURL,
    "_blank"
  );

}
// ==========================
// 🚀 檢視紀錄地圖位置
// ==========================
  function openRecordMap(index) {

  const records =
    JSON.parse(
      localStorage.getItem("forestRecords")
    ) || [];

  const item = records[index];

  if (!item.latitude || !item.longitude) {

    alert("❌ 這筆紀錄沒有 GPS 座標");

    return;

  }

  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    item.latitude + "," +
    item.longitude;

  window.open(url, "_blank");

}

// ==========================
// 🚀 刪除紀錄
// ==========================
function deleteRecord(index) {

  const records =
    JSON.parse(
      localStorage.getItem("forestRecords")
    ) || [];

  if (
    confirm("確定要刪除第 " + (index + 1) + " 筆巡查紀錄嗎？")
  ) {

    records.splice(index, 1);

    localStorage.setItem(
      "forestRecords",
      JSON.stringify(records)
    );

    showRecords();

  }

}

// ==========================
// 🚀 網頁開啟時載入紀錄
// ==========================

showRecords();

</script>
  

</body>
</html>
