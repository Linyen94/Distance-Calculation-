<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 GPS 定位</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      border: none;
      background: #2e7d32;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      line-height: 2;
    }
  </style>
</head>
<body>

  <h1>🌲 森林巡查紀錄</h1>

  <label>林班號</label><br>
  <input id="linban" type="text" placeholder="例如：竹東81林班">

  <br><br>

  <label>巡查結果</label><br>
  <select id="resultType">
    <option>正常</option>
    <option>發現異常</option>
    <option>發現崩塌</option>
    <option>發現違規</option>
    <option>需要後續處理</option>
  </select>

  <br><br>

  <label>備註</label><br>
  <textarea id="note" placeholder="輸入巡查情況"></textarea>

  <br><br>

  <button onclick="getLocation()">
    📍 取得 GPS
  </button>

  <div id="gps">
    尚未定位
  </div>

  <br>

  <button onclick="saveRecord()">
    💾 儲存巡查紀錄
  </button>

  <div id="record"></div>


<script>

let latitude = "";
let longitude = "";

function getLocation() {

  const gps = document.getElementById("gps");

  gps.innerHTML = "📡 正在定位...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      gps.innerHTML =
        "📍 緯度：" + latitude.toFixed(6) + "<br>" +
        "📍 經度：" + longitude.toFixed(6);

    },

    function() {

      gps.innerHTML = "❌ GPS 定位失敗";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}


function saveRecord() {

  const linban =
    document.getElementById("linban").value;

  const resultType =
    document.getElementById("resultType").value;

  const note =
    document.getElementById("note").value;

  const time =
    new Date().toLocaleString("zh-TW");

  document.getElementById("record").innerHTML =

    "<hr>" +
    "<h2>📋 巡查紀錄</h2>" +
    "🕐 時間：" + time + "<br>" +
    "🌲 林班：" + linban + "<br>" +
    "📍 緯度：" + latitude + "<br>" +
    "📍 經度：" + longitude + "<br>" +
    "📌 結果：" + resultType + "<br>" +
    "📝 備註：" + note;

}

</script>
  

</body>
</html>
