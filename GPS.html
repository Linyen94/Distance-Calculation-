<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 GPS 定位</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      border: none;
      background: #2e7d32;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      line-height: 2;
    }
  </style>
</head>
<body>

  <h1>🌲 森林巡查紀錄</h1>

  <label>林班號</label><br>
  <input id="linban" type="text" placeholder="例如：竹東81林班">

  <br><br>

  <label>巡查結果</label><br>
  <select id="resultType">
    <option>正常</option>
    <option>發現異常</option>
    <option>發現崩塌</option>
    <option>發現違規</option>
    <option>需要後續處理</option>
  </select>

  <br><br>

  <label>備註</label><br>
  <textarea id="note" placeholder="輸入巡查情況"></textarea>

  <br><br>

<label>現場照片</label><br>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment"
>

<br>

<img
  id="preview"
  style="max-width:300px; margin-top:15px; display:none;"
>

  <button onclick="getLocation()">
    📍 取得 GPS
  </button>

  <div id="gps">
    尚未定位
  </div>

  <br>

  <button onclick="saveRecord()">
    💾 儲存巡查紀錄
  </button>

  <div id="record"></div>


<script>

let latitude = "";
let longitude = "";

function getLocation() {

  const gps = document.getElementById("gps");

  gps.innerHTML = "📡 正在定位...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      gps.innerHTML =
        "📍 緯度：" + latitude.toFixed(6) + "<br>" +
        "📍 經度：" + longitude.toFixed(6);
        "<br><br>" +
        "<button onclick='openMap()'>🗺️ 查看地圖</button>";

    },

    function() {

      gps.innerHTML = "❌ GPS 定位失敗";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}
function saveRecord() {

  const linban = document.getElementById("linban").value;
  const resultType = document.getElementById("resultType").value;
  const note = document.getElementById("note").value;
  const photo = document.getElementById("photo");

  const time = new Date().toLocaleString("zh-TW");

  // 如果有照片，先轉成可以儲存的格式
  if (photo.files.length > 0) {

    const reader = new FileReader();

    reader.onload = function(e) {

      const record = {
        time: time,
        linban: linban,
        result: resultType,
        note: note,
        latitude: latitude,
        longitude: longitude,
        photo: e.target.result
      };

      saveToStorage(record);
    };

    reader.readAsDataURL(photo.files[0]);

  } else {

    const record = {
      time: time,
      linban: linban,
      result: resultType,
      note: note,
      latitude: latitude,
      longitude: longitude,
      photo: ""
    };

    saveToStorage(record);
  }
}


function saveToStorage(record) {

  let records =
    JSON.parse(localStorage.getItem("forestRecords")) || [];

  records.push(record);

  localStorage.setItem(
    "forestRecords",
    JSON.stringify(records)
  );

  alert("✅ 巡查紀錄已儲存！");

  showRecords();
}
  
function showRecords() {

  const recordBox =
    document.getElementById("record");

  let records =
    JSON.parse(localStorage.getItem("forestRecords")) || [];

  if (records.length === 0) {

    recordBox.innerHTML =
      "<h2>📋 巡查紀錄</h2>" +
      "<p>目前還沒有紀錄</p>";

    return;
  }

  recordBox.innerHTML =
    "<h2>📋 巡查紀錄</h2>";

  records.forEach(function(item, index) {

    recordBox.innerHTML +=

      "<div style='border:1px solid #ccc;" +
      "padding:15px;margin:15px 0;border-radius:10px;'>" +

      "<b>第 " + (index + 1) + " 筆</b><br><br>" +

      "🕐 時間：" + item.time + "<br>" +
      "🌲 林班：" + item.linban + "<br>" +
      "📍 緯度：" + item.latitude + "<br>" +
      "📍 經度：" + item.longitude + "<br>" +
      "📌 結果：" + item.result + "<br>" +
      "📝 備註：" + item.note +

      (item.photo
        ? "<br><br><img src='" + item.photo +
          "' style='max-width:100%;border-radius:10px;'>"
        : "") +

      "</div>";

  });
}
  function openMap() {

  if (!latitude || !longitude) {
    alert("❌ 請先取得 GPS 位置");
    return;
  }

  const mapURL =
    "https://www.google.com/maps/search/?api=1&query=" +
    latitude + "," + longitude;

  window.open(mapURL, "_blank");
}
  showRecords();
</script>
  

</body>
</html>
