<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林巡查工具箱</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🌲 森林巡查工具箱</h1>

    <h2>📏 距離計算</h2>

    <input id="distance" type="number" placeholder="輸入距離（公里）">

    <button onclick="calculate()">計算</button>

    <div id="result"></div>

</div>

<script>

function calculate() {

    let km = Number(document.getElementById("distance").value);

    let meters = km * 1000;

    document.getElementById("result").innerHTML =
        "距離：" + meters + " 公尺";

}

</script>

</body>
</html>
